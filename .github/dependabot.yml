# Dependabot: one pull request a week per ecosystem, so a Pillow-class advisory (CLAUDE.md
# §11, Security review) arrives as a PR rather than being found by hand. CI's pip-audit and
# pnpm audit are the backstop between runs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # The build toolchain moves only on purpose (CLAUDE.md §11, Dependency updates): a major
    # TypeScript, Vite or PWA-plugin release changes how the app is built, cached offline and
    # updated on the gate devices, so it is a planned change tested on phone B and desktop A —
    # never a weekly group PR. Runtime libraries (react, supabase-js, idb-keyval) still get
    # majors, so a security fix that needs one is not held back; pnpm audit in CI is the
    # backstop for the toolchain.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plugin-pwa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "workbox-*"
        update-types: ["version-update:semver-major"]
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /services/engine
    schedule: { interval: weekly }
    groups:
      engine: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /services/engine
    schedule: { interval: weekly }
