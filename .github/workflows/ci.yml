name: CI

# Every pull request, and every push to main. The Pages workflow (deploy.yml) only ever ran
# on main, which is how a broken build reached main before anyone saw it; this runs first.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` — package.json's packageManager field is the single source of truth.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in what ships to the browser fail the build.
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: A device token can never be built into the public bundle
        # vite.config.ts refuses a production build with VITE_DEVICE_TOKEN set. Prove the
        # guard still exists — and if it were ever removed, say whether the token leaked.
        run: |
          set +e
          VITE_DEVICE_TOKEN=ci-canary-7f3a9c2e pnpm build > canary.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::a production build with VITE_DEVICE_TOKEN set succeeded — the vite.config.ts guard is gone"
            if grep -rl ci-canary-7f3a9c2e apps/web/dist; then
              echo "::error::and the token IS in the built JavaScript"
            fi
            exit 1
          fi
          if ! grep -q "VITE_DEVICE_TOKEN is set" canary.log; then
            echo "::error::the canary build failed, but not because of the token guard"
            cat canary.log
            exit 1
          fi
          echo "guard refused the canary build, as it should"

  engine:
    name: engine (lint · pytest · schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine

    # Real Postgres, so tests/test_db_schema.py replays the engine's payloads against the
    # real migrations. It is configured to FAIL rather than skip if this is unreachable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      VTRACK_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The same uv the lockfile was produced with; no third-party action needed.
      - run: python -m pip install --disable-pip-version-check uv==0.8.17

      - run: uv sync --frozen
      - run: uv run ruff check .

      # Known vulnerabilities in the engine's locked dependencies fail the build. The engine
      # opens untrusted JPEGs (Pillow, OpenCV) while holding the service key, so an advisory
      # there is a stop, not a note.
      - name: pip-audit over uv.lock
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit==2.9.0 --progress-spinner off -r /tmp/requirements.txt --no-deps

      # The default run excludes `slow` (the real model, which downloads ~11 MB); it is run
      # before each hand-over and on the laptop. Everything else runs here, with no secrets.
      - run: uv run pytest

  docker:
    name: docker (image · offline · half a CPU)
    runs-on: ubuntu-latest
    # The image Render deploys, built from the same Dockerfile and run with NO network: a
    # model that is not baked in cannot load, so `model_status: ready` proves it is. Half a
    # CPU and 512 MB are Render Starter's limits.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/engine
          load: true
          tags: vtrack-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Starts offline and answers /health, /ready and /recognise honestly
        run: |
          docker run -d --name engine --network none --cpus 0.5 --memory 512m vtrack-engine:ci
          # --network none: nothing outside can reach it, so the probe asks from inside.
          docker exec -i engine python - < services/engine/scripts/container_probe.py

      - name: Reads a real plate offline, inside the 400 ms budget
        run: |
          docker run --rm --network none --cpus 0.5 --memory 512m \
            -v "$PWD/services/engine/tests/fixtures:/fx:ro" vtrack-engine:ci \
            python -m vtrack_engine.selftest /fx/plate_SNB9538E_white_on_black.jpg \
              --expect SNB9538E --runs 40 | tee selftest.json
          echo "### Engine image at 0.5 CPU / 512 MB" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat selftest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Engine log
        if: always()
        run: docker logs engine 2>&1 | tail -50 || true
