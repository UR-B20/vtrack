[project]
name = "vtrack-engine"
version = "0.1.0"
description = "VTrack Engine: reads a plate, validates it, decides, writes one event (CLAUDE.md §5)."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "numpy==2.5.3",
  "slowapi==0.1.10",
  "python-multipart==0.0.32",
  "fast-alpr[onnx]==0.4.0",
  # fast-alpr 0.4 only floors opencv at 4.9, so an unpinned resolve picks 5.0 — a major
  # version fast-alpr was not built against, and one no test here can exercise without
  # running the model. Lift this once a real read has been confirmed on 5.x.
  "opencv-python-headless>=4.9,<5",
]

[project.scripts]
vtrack-engine = "vtrack_engine.__main__:main"
vtrack-pair-qr = "vtrack_engine.pairqr:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
  # Only for tests/test_db_schema.py, which replays the engine's payloads on real Postgres.
  "psycopg[binary]==3.3.6",
  "qrcode==8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtrack_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: runs the real ALPR model; downloads ~11 MB of weights on first run. `pytest -m slow`.",
]
# The default run is fast and needs no network. The real-model check is opt-in.
addopts = "-m 'not slow'"
filterwarnings = [
  # Inside fast-alpr 0.4, which calls an open-image-models API that library has since
  # deprecated. Not ours to fix; scoped to exactly that message so nothing else hides.
  "ignore:LicensePlateDetector is deprecated:DeprecationWarning",
  # Starlette 1.7 deprecates httpx inside its TEST client only; the engine never uses it.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test tables (seed rows, parametrize cases) read better one row per line.
"tests/**" = ["E501"]
